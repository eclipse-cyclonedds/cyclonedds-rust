[package]
name = "eclipse-cyclonedds-sys"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true
description = "Raw FFI Bindings for Eclipse Cyclone DDS"
categories = [
  "automotive",
  "external-ffi-bindings",
  "network-programming",
  "science::robotics",
]

[lib]
name = "cyclonedds_sys"
# Every doc comment in this crate is a C comment that `bindgen` copied out of a
# Cyclone DDS header, so "doctests" here are really fenced code blocks of C being
# compiled as Rust. `dds_psmx.h` has one, for instance. What rustdoc collects
# therefore depends on the comment formatting of whichever version of the C
# headers is being built against, which is not something this crate can fix.
doctest = false

[dependencies]

[build-dependencies]
bindgen = "0.73.2"
cmake = { version = "0.1.58", optional = true }
filetime = { version = "0.2.29", optional = true }
tempfile = { version = "3.27.0", optional = true }

[features]
vendored = ["dep:cmake", "dep:tempfile", "dep:filetime"]

[package.metadata.docs.rs]
features = ["vendored"]
