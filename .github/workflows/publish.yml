name: publish crates

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

concurrency:
  group: crates-io-publish
  cancel-in-progress: false
  queue: max

jobs:
  checks:
    uses: ./.github/workflows/check.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: true

      - name: verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib

          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["workspace"]["package"]["version"]
          tag = os.environ["RELEASE_TAG"]
          if tag != version:
              raise SystemExit(f"Tag {tag!r} must match workspace version {version}")
          PY

      - name: set up nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35

      - name: set up nix devshell
        run: nix develop -c cargo --version

      - name: dry-run publishing
        run: |
          nix develop -c cargo publish --dry-run \
            --package eclipse-cyclonedds-sys \
            --package eclipse-cyclonedds-macros \
            --package eclipse-cyclonedds

      - name: verify bundled Cyclone DDS sources
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import tarfile
          from pathlib import Path

          package = f"eclipse-cyclonedds-sys-{os.environ['RELEASE_TAG']}"
          archive = Path("target/package") / f"{package}.crate"
          header = f"{package}/vendor/cyclonedds-c/src/core/ddsc/include/dds/dds.h"
          with tarfile.open(archive, "r:gz") as crate:
              if not any(member.name == header and member.isfile() and member.size > 0
                         for member in crate):
                  raise SystemExit(f"Missing vendored Cyclone DDS header in {archive}: {header}")
          PY

      - name: authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          nix develop -c cargo publish \
            --package eclipse-cyclonedds-sys \
            --package eclipse-cyclonedds-macros \
            --package eclipse-cyclonedds
